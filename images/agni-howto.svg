<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4D3A"/>
      <stop offset="1" stop-color="#123526"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#D99A1E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="120" r="600" fill="#F2C94C" opacity="0.05"/>

  <text x="400" y="110" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F2C94C" letter-spacing="4">HOW TO TAKE AGNI</text>
  <text x="400" y="170" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="52" font-weight="700" fill="#FBF7EC">Twice a day. That is all.</text>

  <!-- step 1 -->
  <g transform="translate(120 260)">
    <circle cx="40" cy="40" r="40" fill="url(#gold)"/>
    <text x="40" y="52" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="38" font-weight="700" fill="#123526">1</text>
    <text x="110" y="34" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#FBF7EC">Fill the dropper</text>
    <text x="110" y="66" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#CFE3D6">Squeeze once. One dropper is one dose.</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(120 420)">
    <circle cx="40" cy="40" r="40" fill="url(#gold)"/>
    <text x="40" y="52" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="38" font-weight="700" fill="#123526">2</text>
    <text x="110" y="34" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#FBF7EC">Add to warm water</text>
    <text x="110" y="66" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#CFE3D6">Half a glass. Drink it in one go.</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(120 580)">
    <circle cx="40" cy="40" r="40" fill="url(#gold)"/>
    <text x="40" y="52" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="38" font-weight="700" fill="#123526">3</text>
    <text x="110" y="34" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#FBF7EC">Morning and night</text>
    <text x="110" y="66" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#CFE3D6">After breakfast. After dinner. Every day.</text>
  </g>

  <!-- glass -->
  <g transform="translate(400 820)">
    <path d="M-70 -90 L 70 -90 L 55 70 L -55 70 Z" fill="#FBF7EC" opacity="0.12" stroke="#FBF7EC" stroke-width="3"/>
    <path d="M-62 -20 L 62 -20 L 55 70 L -55 70 Z" fill="url(#gold)" opacity="0.8"/>
    <circle cx="0" cy="-130" r="6" fill="#F2C94C"/>
    <circle cx="0" cy="-108" r="4" fill="#F2C94C" opacity="0.7"/>
  </g>

  <text x="400" y="960" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#CFE3D6" opacity="0.6" letter-spacing="2">PLACEHOLDER DOSE. CONFIRM WITH DR. MADHU.</text>
</svg>
