<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EC"/>
      <stop offset="1" stop-color="#F3EBD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#F2C94C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2C94C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A2E0C"/>
      <stop offset="0.35" stop-color="#8A4A14"/>
      <stop offset="0.55" stop-color="#B8701F"/>
      <stop offset="0.75" stop-color="#7A3F10"/>
      <stop offset="1" stop-color="#4A250A"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F2C20"/>
      <stop offset="0.5" stop-color="#1F4D3A"/>
      <stop offset="1" stop-color="#0F2C20"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EC"/>
      <stop offset="1" stop-color="#EFE3C4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C94C"/>
      <stop offset="0.5" stop-color="#D99A1E"/>
      <stop offset="1" stop-color="#B57A10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#123526" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="560" r="330" fill="url(#glow)"/>

  <!-- leaves behind -->
  <g opacity="0.9">
    <path d="M150 700 C 120 600, 180 520, 290 520 C 280 620, 230 690, 150 700 Z" fill="#2E6B4F"/>
    <path d="M150 700 C 200 640, 240 590, 290 520" stroke="#1F4D3A" stroke-width="4" fill="none" opacity="0.6"/>
    <path d="M650 720 C 690 620, 640 530, 520 530 C 520 640, 570 700, 650 720 Z" fill="#3B7D5C"/>
    <path d="M650 720 C 600 660, 560 610, 520 530" stroke="#1F4D3A" stroke-width="4" fill="none" opacity="0.6"/>
  </g>

  <!-- dropper -->
  <g filter="url(#shadow)">
    <rect x="372" y="150" width="56" height="70" rx="10" fill="#1A1A1A"/>
    <ellipse cx="400" cy="150" rx="30" ry="18" fill="#2A2A2A"/>
    <rect x="360" y="215" width="80" height="60" rx="8" fill="url(#cap)"/>
    <g stroke="#0B2016" stroke-width="2" opacity="0.6">
      <line x1="368" y1="222" x2="368" y2="268"/><line x1="380" y1="222" x2="380" y2="268"/><line x1="392" y1="222" x2="392" y2="268"/>
      <line x1="404" y1="222" x2="404" y2="268"/><line x1="416" y1="222" x2="416" y2="268"/><line x1="428" y1="222" x2="428" y2="268"/>
    </g>
  </g>

  <!-- bottle body -->
  <g filter="url(#shadow)">
    <path d="M300 300 C 300 285, 310 275, 325 275 L 475 275 C 490 275, 500 285, 500 300 L 500 330 C 540 350, 560 390, 560 440 L 560 820 C 560 860, 530 890, 490 890 L 310 890 C 270 890, 240 860, 240 820 L 240 440 C 240 390, 260 350, 300 330 Z" fill="url(#glass)"/>
    <!-- glass highlight -->
    <path d="M270 420 C 268 380, 285 350, 310 340 L 310 850 C 290 850, 272 835, 270 810 Z" fill="#FFFFFF" opacity="0.14"/>
    <path d="M530 420 C 532 380, 515 350, 490 340 L 490 850 C 510 850, 528 835, 530 810 Z" fill="#000000" opacity="0.18"/>
    <!-- glass tube inside -->
    <rect x="392" y="280" width="16" height="520" rx="8" fill="#F2C94C" opacity="0.35"/>
  </g>

  <!-- label -->
  <rect x="268" y="470" width="264" height="330" rx="18" fill="url(#label)" stroke="url(#gold)" stroke-width="4"/>
  <rect x="284" y="486" width="232" height="298" rx="12" fill="none" stroke="#D99A1E" stroke-width="1.5" opacity="0.6"/>

  <!-- flame mark -->
  <g transform="translate(400 560)">
    <path d="M0 -58 C 22 -34, 34 -16, 34 6 C 34 30, 18 46, 0 46 C -18 46, -34 30, -34 6 C -34 -8, -28 -20, -18 -28 C -18 -12, -10 -4, -4 -4 C -10 -20, -8 -40, 0 -58 Z" fill="url(#gold)"/>
    <path d="M0 -22 C 10 -10, 16 0, 16 12 C 16 24, 8 32, 0 32 C -8 32, -16 24, -16 12 C -16 4, -12 -2, -6 -8 C -6 0, -2 4, 0 4 C -4 -6, -4 -14, 0 -22 Z" fill="#FBF7EC" opacity="0.9"/>
  </g>

  <text x="400" y="668" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-weight="700" font-size="74" fill="#1F4D3A" letter-spacing="6">AGNI</text>
  <text x="400" y="700" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" fill="#5C4A1E" letter-spacing="3">AYURVEDIC METABOLISM DROPS</text>
  <line x1="320" y1="722" x2="480" y2="722" stroke="#D99A1E" stroke-width="1.5"/>
  <text x="400" y="750" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-weight="500" font-size="14" fill="#5C4A1E">by Dr. Madhu Sudan</text>
  <text x="400" y="776" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#8A7A4A" letter-spacing="1">30 ml · ORAL DROPS</text>

  <!-- placeholder stamp -->
  <g transform="translate(400 940)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#1F4D3A" opacity="0.08"/>
    <text x="0" y="6" text-anchor="middle" font-family="DM Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F4D3A" opacity="0.6" letter-spacing="2">PLACEHOLDER BOTTLE</text>
  </g>
</svg>
